services:
  - type: web
    name: generador-articulos-revista
    runtime: static
    buildCommand: echo "Sitio estático sin compilación"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache
